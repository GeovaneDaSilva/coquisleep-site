es: `
<h3>1. Resumen</h3>
<p>CoquiSleep ("CoquiSleep", "nosotros") es una aplicación móvil que ofrece cuentos para dormir, canciones de cuna y contenido de audio relajante para niños, creada para familias en español, inglés y portugués. Esta Política de Privacidad explica qué información recopila CoquiSleep (y, más importante aún, qué información NO recopila), cómo se usa y cuáles son tus derechos. CoquiSleep es operada por Geovane, un desarrollador independiente. Si tienes preguntas, escríbenos a info@coquisleep.app.</p>

<h3>2. No se requiere cuenta</h3>
<p>CoquiSleep no requiere que tú o tu hijo/a creen una cuenta, se registren, inicien sesión ni proporcionen nombre de usuario, contraseña o perfil para usar la app. Puedes explorar y escuchar todo el contenido de la app sin darnos ningún dato personal.</p>

<h3>3. Información que recopilamos</h3>
<p>A la fecha de esta Política, CoquiSleep no recopila, almacena ni transmite ningún dato personal de niños ni de adultos a través de la app. No pedimos nombres, fechas de nacimiento, fotos, ubicación, contactos ni ningún otro identificador personal. Las compras se procesan por completo a través de Apple (App Store) o Google (Google Play) — ver Sección 6.</p>

<h3>4. Privacidad infantil y COPPA</h3>
<p>CoquiSleep está diseñada para ser segura para niños y cumple con la Ley de Protección de la Privacidad Infantil en Línea de EE. UU. (COPPA, por sus siglas en inglés). No recopilamos a sabiendas información personal de niños menores de 13 años y, dado que la app no requiere cuenta ni registro, no se recopila este tipo de información durante el uso normal de la app. Si en algún momento identificamos que un niño nos proporcionó datos personales por error (por ejemplo, a través de un correo de soporte), los eliminaremos de inmediato.</p>
<p>Los padres o tutores que crean que su hijo/a nos proporcionó información personal pueden contactarnos en info@coquisleep.app para solicitar la revisión o eliminación de esa información.</p>

<h3>5. Analítica futura</h3>
<p>Actualmente CoquiSleep no utiliza ningún servicio de analítica, publicidad ni rastreo. Si en el futuro incorporamos analítica de uso para mejorar la app, usaremos únicamente un proveedor con configuraciones compatibles con COPPA (sin publicidad conductual, sin rastreo entre apps, sin recopilación de identificadores persistentes para publicidad dirigida), y actualizaremos esta Política antes de activarla.</p>

<h3>6. Compras y suscripciones</h3>
<p>CoquiSleep ofrece una suscripción mensual opcional y de renovación automática ($4.99/mes) que desbloquea contenido adicional. Todas las compras y suscripciones se procesan íntegramente a través de Apple (App Store) o Google (Google Play Store). CoquiSleep nunca ve, recibe ni almacena los datos de tu tarjeta de pago, dirección de facturación ni ningún otro dato de pago — esa información la maneja exclusivamente Apple o Google, bajo sus propias políticas de privacidad:</p>
<ul>
<li>Apple: <a href="https://www.apple.com/legal/privacy/">https://www.apple.com/legal/privacy/</a></li>
<li>Google: <a href="https://policies.google.com/privacy">https://policies.google.com/privacy</a></li>
</ul>

<h3>7. Contenido generado con IA</h3>
<p>Los cuentos, ilustraciones, narraciones y música de CoquiSleep se crean con la ayuda de herramientas de inteligencia artificial y son revisados por nuestro equipo antes de publicarse. El uso de estas herramientas no implica recopilar información personal tuya ni de tu hijo/a.</p>

<h3>8. Sin alegaciones médicas o terapéuticas</h3>
<p>CoquiSleep es una app de entretenimiento y relajación. No es un dispositivo médico ni un servicio médico, clínico o terapéutico, y no diagnostica, trata ni ofrece consejos sobre ninguna condición de salud, incluyendo trastornos del sueño. Nada en la app debe tomarse como consejo médico.</p>

<h3>9. Seguridad de los datos</h3>
<p>Como CoquiSleep no recopila datos personales, no existe riesgo de exposición de datos personales durante el uso normal de la app. Si esto cambiara en el futuro (ver Sección 5), describiremos en ese momento las medidas de seguridad correspondientes.</p>

<h3>10. Cambios a esta Política</h3>
<p>Podemos actualizar esta Política de Privacidad periódicamente, especialmente antes de introducir cualquier nueva recopilación de datos (ver Sección 5). Publicaremos la versión actualizada en la app y/o en coquisleep.app con una nueva fecha de vigencia. El uso continuado de la app después de una actualización implica que aceptas la Política revisada.</p>

<h3>11. Contacto</h3>
<p>¿Preguntas sobre esta Política de Privacidad? Escríbenos a info@coquisleep.app.</p>

<p><em>Este documento es un borrador basado en las políticas de privacidad publicadas de apps infantiles comparables y en las guías de la FTC/COPPA; no sustituye el asesoramiento legal independiente.</em></p>

en: `
<h3>1. Overview</h3>
<p>CoquiSleep ("CoquiSleep", "we", "us") is a mobile app that offers bedtime stories, lullabies, and calming audio content for children, created for families in Spanish, English, and Portuguese. This Privacy Policy explains what information CoquiSleep collects (and, just as importantly, what it does not collect), how it is used, and your rights. CoquiSleep is operated by Geovane, an independent developer. If you have questions, contact us at info@coquisleep.app.</p>

<h3>2. No Account Required</h3>
<p>CoquiSleep does not require you or your child to create an account, register, log in, or provide a username, password, or profile to use the app. You can browse and listen to all content the app offers without giving us any personal information.</p>

<h3>3. Information We Collect</h3>
<p>As of the date of this Policy, CoquiSleep does not collect, store, or transmit any personal information from children or adults through the app. We do not ask for names, birthdates, photos, location, contacts, or any other personal identifier. Purchases are handled entirely by Apple (App Store) or Google (Google Play) — see Section 6.</p>

<h3>4. Children's Privacy and COPPA</h3>
<p>CoquiSleep is designed to be safe for children and complies with the Children's Online Privacy Protection Act (COPPA). We do not knowingly collect any personal information from children under 13, and because the app requires no account or sign-up, no such information is collected through normal use of the app. If we ever believe a child has provided personal information to us in error (for example, through a support email), we will delete it promptly.</p>
<p>Parents and guardians who believe their child has provided us with personal information may contact us at info@coquisleep.app to request review or deletion of that information.</p>

<h3>5. Future Analytics</h3>
<p>CoquiSleep does not currently use any analytics, advertising, or tracking service. If we introduce usage analytics in the future to improve the app, we will only use a provider that offers COPPA-compliant, child-directed configurations (no behavioral advertising, no cross-app tracking, no collection of persistent identifiers used for ad targeting), and we will update this Privacy Policy before activating it.</p>

<h3>6. Purchases and Subscriptions</h3>
<p>CoquiSleep offers an optional monthly subscription ($4.99/month, auto-renewing) that unlocks additional content. All purchases and subscriptions are processed entirely by Apple (App Store) or Google (Google Play Store). CoquiSleep never sees, receives, or stores your payment card information, billing address, or any other payment data — that information is handled exclusively by Apple's and Google's own systems under their own privacy policies:</p>
<ul>
<li>Apple: <a href="https://www.apple.com/legal/privacy/">https://www.apple.com/legal/privacy/</a></li>
<li>Google: <a href="https://policies.google.com/privacy">https://policies.google.com/privacy</a></li>
</ul>

<h3>7. AI-Generated Content</h3>
<p>Stories, illustrations, narration, and music in CoquiSleep are created with the help of artificial intelligence tools and reviewed by our team before publication. Using these tools does not involve collecting personal information about you or your child.</p>

<h3>8. No Medical or Therapeutic Claims</h3>
<p>CoquiSleep is an entertainment and relaxation app. It is not a medical device or a medical, clinical, or therapeutic service, and it does not diagnose, treat, or provide advice about any health condition, including sleep disorders. Nothing in the app should be treated as medical advice.</p>

<h3>9. Data Security</h3>
<p>Because CoquiSleep does not collect personal data, there is no personal data at risk during normal use of the app. Should this change in the future (see Section 5), we will describe the safeguards in place at that time.</p>

<h3>10. Changes to This Policy</h3>
<p>We may update this Privacy Policy from time to time, especially before introducing any new data collection (see Section 5). We will post the updated version in the app and/or on coquisleep.app with a new effective date. Continued use of the app after an update means you accept the revised Policy.</p>

<h3>11. Contact Us</h3>
<p>Questions about this Privacy Policy? Contact us at info@coquisleep.app.</p>

<p><em>This document is a draft informed by the published privacy policies of comparable children's apps and by FTC/COPPA guidance; it is not a substitute for independent legal advice.</em></p>

  var lang = 'es';
  try { lang = localStorage.getItem('coquisleep_lang') || 'es'; } catch(e){ lang = 'es'; }

  function render(){
    document.getElementById('content').innerHTML = BODY[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n');
      if (k === 'title') el.textContent = TITLES[lang];

      if (k === 'back') el.textContent = BACK[lang];
    });
    document.querySelectorAll('.lang-chip button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
    });
    document.documentElement.setAttribute('lang', lang);
  }

  document.querySelectorAll('.lang-chip button').forEach(function(b){
    b.addEventListener('click', function(){
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('coquisleep_lang', lang); } catch(e){}
      render();
    });
  });
