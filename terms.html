  var lang = 'es';
  try { lang = localStorage.getItem('coquisleep_lang') || 'es'; } catch(e){ lang = 'es'; }

  function render(){
    document.getElementById('content').innerHTML = BODY[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){

      if (k === 'title') el.textContent = TITLES[lang];

    document.querySelectorAll('.lang-chip button').forEach(function(b){

    });
    document.documentElement.setAttribute('lang', lang);

  document.querySelectorAll('.lang-chip button').forEach(function(b){
    b.addEventListener('click', function(){
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('coquisleep_lang', lang); } catch(e){}
      render();
    });
