<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
  :root{
    --bg-top:#1B1640; --bg-bottom:#0E0B22;
    --surface:#241E44; --surface-raised:#2E2755; --line:rgba(255,255,255,.10);
    --lavender:#9B8CFF; --lavender-soft:#C3B9FF; --turquoise:#5FD9C7; --moon-gold:#FFD98A;
    --coral:#FF6F59; --coral-strong:#E5503B; --coral-hover:#CE402D;
    --coqui-green:#3ECF8E; --coqui-green-deep:#219A66;
    --text-primary:#F3F1FB; --text-secondary:#B5AEDD; --text-muted:#9992C7;
    --font-display:'Fredoka',system-ui,sans-serif; --font-body:'Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 55%,#0A0819 100%) fixed;
    color:var(--text-primary); font-family:var(--font-body); padding-inline:20px;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
  .wrap{max-width:1100px; margin:0 auto;}
  p{line-height:1.6;}
  svg#brand-defs{position:absolute; width:0; height:0; overflow:hidden;}
  ::selection{background:var(--coral-strong); color:#fff;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg-bottom);}
  ::-webkit-scrollbar-thumb{background:var(--surface-raised); border-radius:999px;}
  html{scrollbar-color:var(--surface-raised) var(--bg-bottom);}
  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--turquoise); outline-offset:2px;}
  .reveal{opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1; transform:none; transition:none;}
    #mp, #cp, #mp *, #cp *, .hero::before, .wave-row span{ animation: none; }
  }

  header.topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding-block:20px; background:transparent; border-bottom:1px solid transparent; transition:background-color .2s, border-color .2s;}
  header.topbar.scrolled{background:rgba(14,11,34,.85); backdrop-filter:blur(10px); border-color:var(--line); margin-inline:-20px; padding-inline:20px;}
  .logo{display:flex; align-items:center; gap:10px;}
  .logo svg{width:34px;height:34px;}
  .logo span{font-family:var(--font-display); font-weight:600; font-size:19px;}
  .logo .co{color:var(--coral);} .logo .sl{color:var(--lavender-soft);}
  .lang-chip{display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px; font-size:12px; font-weight:800;}
  .lang-chip button{all:unset; cursor:pointer; padding:5px 12px; border-radius:999px; color:var(--text-muted); font-family:inherit; font-size:inherit; font-weight:inherit;}
  .lang-chip button.on{background:var(--coral-strong); color:#fff;}

  .hero{padding-block:56px 40px; position:relative; text-align:left; overflow:hidden;}
  .hero::before{content:"";position:absolute; top:-60px; right:-10%; width:70%; height:420px;
    background:radial-gradient(ellipse 60% 100% at 70% 0%, rgba(255,217,138,.18), transparent 70%); pointer-events:none; z-index:0;}
  .hero-inner{position:relative; z-index:1; display:flex; gap:48px; align-items:center; flex-wrap:wrap;}
  .hero-copy{flex:1 1 420px; min-width:280px;}
  .badge{display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:12px; font-weight:800; color:var(--turquoise); margin-bottom:18px;}
  .badge svg{width:14px;height:14px;}
  .hero h1{font-size:clamp(32px,5vw,52px); font-weight:600; line-height:1.06;}
  .hero h1 .accent{color:var(--coral);}
  .hero p.sub{color:var(--text-secondary); font-size:18px; max-width:46ch; margin-top:18px;}
  .cta-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:22px; align-items:center;}
  .store-btn{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 20px; color:var(--text-primary); text-decoration:none; font-weight:700; font-size:14px; min-height:44px; position:relative; opacity:.4; cursor:default;}
  .store-btn .small{display:block; font-size:10px; color:var(--text-muted); font-weight:600;}
  .store-btn svg{width:20px;height:20px;flex:none;}
  .soon-tag{background:var(--moon-gold); color:#3A2A00; font-size:9.5px; font-weight:800; letter-spacing:.03em; padding:4px 10px; border-radius:999px; align-self:center;}
  .trust-row{display:flex; gap:22px; flex-wrap:wrap; margin-top:24px; font-size:13px; color:var(--text-muted);}
  .trust-row span{display:flex; align-items:center; gap:6px;}
  .trust-row svg{width:15px;height:15px; color:var(--turquoise);}

  .hero-art{flex:1 1 300px; min-width:260px; display:flex; justify-content:center;}
  .hero-stage{width:min(100%,340px); aspect-ratio:1; border-radius:32px; position:relative;
    background:radial-gradient(ellipse 70% 90% at 50% 15%, rgba(255,217,138,.22), transparent 65%), linear-gradient(150deg,var(--surface),var(--bg-bottom));
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .hero-stage svg{width:56%;}

  section{padding-block:52px; border-top:1px solid var(--line);}
  .eyebrow{font-family:var(--font-body); font-weight:800; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--turquoise); margin:0 0 10px;}
  section h2{font-size:clamp(24px,3.4vw,34px); font-weight:600;}
  section p.lede{color:var(--text-secondary); font-size:16px; max-width:60ch; margin-top:12px;}

  .value-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:34px;}
  @media (max-width:860px){.value-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.value-grid{grid-template-columns:1fr;}}
  .value-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; transition:transform .2s, border-color .2s, box-shadow .2s;}
  .value-card:hover{transform:translateY(-3px); border-color:rgba(255,255,255,.2); box-shadow:0 10px 24px rgba(0,0,0,.25);}
  .value-card .ic{width:38px;height:38px; border-radius:11px; background:var(--surface-raised); display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .value-card .ic svg{width:20px;height:20px; color:var(--coral);}
  .value-card h3{font-size:15px; font-weight:800; font-family:var(--font-body); margin-bottom:6px;}
  .value-card p{font-size:13px; color:var(--text-muted); margin:0; line-height:1.5;}

  .story-section{display:flex; gap:48px; align-items:center; flex-wrap:wrap;}
  .story-art{flex:1 1 260px; min-width:220px; display:flex; justify-content:center;}
  .story-art svg{width:70%; max-width:220px;}
  .story-copy{flex:2 1 380px; min-width:280px;}
  .story-copy p{color:var(--text-secondary); font-size:16px; max-width:58ch;}
  .story-quote{margin-top:20px; padding-left:18px; border-left:3px solid var(--coral); font-family:var(--font-display); font-size:19px; color:var(--text-primary); font-weight:500;}

  /* catalog */
  .cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:28px;}
  @media (max-width:860px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.cat-grid{grid-template-columns:1fr;}}
  .cat-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:none; transition:transform .2s, border-color .2s, box-shadow .2s;}
  .cat-card.show{display:block;}
  .cat-card:hover{transform:translateY(-3px); border-color:rgba(255,255,255,.2); box-shadow:0 10px 24px rgba(0,0,0,.25);}
  .cat-card .cat-ic{display:block; margin-bottom:10px;}
  .cat-card .kind{font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--moon-gold);}
  .cat-card h3{font-size:15.5px; font-weight:700; margin-top:6px; line-height:1.3;}
  .cat-card p{font-size:13px; color:var(--text-muted); margin-top:8px; line-height:1.55;}
  .catalog-count{margin-top:18px; font-size:13px; color:var(--text-muted);}
  .catalog-count strong{color:var(--moon-gold); font-family:var(--font-display); font-size:16px;}

  /* sound design */
  #sound{position:relative; overflow:hidden;}
  #sound::before{content:""; position:absolute; top:-40px; left:-15%; width:60%; height:360px;
    background:radial-gradient(ellipse 60% 100% at 30% 0%, rgba(95,217,199,.12), transparent 70%); pointer-events:none; z-index:0;}
  #sound > *{position:relative; z-index:1;}
  .wave-row{display:flex; align-items:flex-end; gap:4px; height:64px; margin:26px 0; opacity:.85;}
  .wave-row span{flex:1; background:linear-gradient(180deg,var(--turquoise),var(--lavender)); border-radius:3px; min-width:3px;}

  /* ===== Coquí mascot animations (#mp = moon-perch, #cp = story portrait) ===== */
  #mp, #cp{
    transform-box: fill-box;
    transform-origin: center;
    animation: coqui-breathe 4.4s ease-in-out infinite;
  }
  #mp circle:nth-of-type(n+4):nth-of-type(-n+9),
  #cp circle:nth-of-type(n+5):nth-of-type(-n+10){
    transform-box: fill-box;
    transform-origin: center;
    animation: coqui-blink 5.4s ease-in-out infinite;
  }
  #mp ellipse:nth-of-type(4),
  #cp circle:nth-of-type(2){
    transform-box: fill-box;
    transform-origin: center;
    animation: coqui-throat 6s ease-out infinite;
  }
  @keyframes coqui-breathe{
    0%, 100%{ transform: translateY(0) scale(1); }
    50%{ transform: translateY(-1.5px) scale(1.015); }
  }
  @keyframes coqui-blink{
    0%, 92%, 100%{ transform: scaleY(1); }
    96%{ transform: scaleY(.08); }
  }
  @keyframes coqui-throat{
    0%, 16%, 100%{ transform: scaleY(1); }
    4%{ transform: scaleY(1.14); }
    8%{ transform: scaleY(1); }
    11%{ transform: scaleY(1.16); }
  }

  /* ===== coqui-singing: one-shot, audio-synced call on first visit ===== */
  body.coqui-singing #mp ellipse:nth-of-type(4),
  body.coqui-singing #cp circle:nth-of-type(2){
    animation: coqui-sing-throat 1.8s ease-in-out 1 !important;
  }
  @keyframes coqui-sing-throat{
    0%, 100%{ transform: scaleY(1) scaleX(1); }
    18%{ transform: scaleY(1.55) scaleX(1.12); }
    32%{ transform: scaleY(1) scaleX(1); }
    55%{ transform: scaleY(1.7) scaleX(1.16); }
    75%{ transform: scaleY(1) scaleX(1); }
  }

  /* ===== hero moon-glow, slow breathing pulse ===== */
  .hero::before{ animation: glow-breathe 9s ease-in-out infinite; }
  @keyframes glow-breathe{
    0%, 100%{ opacity: 1; }
    50%{ opacity: .6; }
  }

  /* ===== sound-design wave bars, staggered slow settle ===== */
  .wave-row span{
    animation: wave-breathe 3.6s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .wave-row span:nth-child(3n+1){ animation-delay: 0s; }
  .wave-row span:nth-child(3n+2){ animation-delay: .4s; }
  .wave-row span:nth-child(3n){ animation-delay: .8s; }
  @keyframes wave-breathe{
    0%, 100%{ transform: scaleY(1); }
    50%{ transform: scaleY(.85); }
  }
  .sound-steps{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:8px;}
  @media (max-width:860px){.sound-steps{grid-template-columns:1fr;}}
  .sound-step{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; transition:transform .2s, border-color .2s, box-shadow .2s;}
  .sound-step:hover{transform:translateY(-3px); border-color:rgba(255,255,255,.2); box-shadow:0 10px 24px rgba(0,0,0,.25);}
  .sound-step .n{font-family:var(--font-display); font-size:20px; color:var(--coral); font-weight:600;}
  .sound-step h3{font-size:14.5px; font-weight:800; margin-top:8px;}
  .sound-step p{font-size:13px; color:var(--text-muted); margin-top:6px; line-height:1.55;}

  /* demo */
  #demo{position:relative; overflow:hidden;}
  #demo::before{content:""; position:absolute; top:-40px; right:-15%; width:60%; height:360px;
    background:radial-gradient(ellipse 60% 100% at 70% 0%, rgba(229,80,59,.14), transparent 70%); pointer-events:none; z-index:0;}
  #demo > *{position:relative; z-index:1;}
  .carousel{position:relative;}
  .carousel-track{
    display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory;
    margin-top:32px; padding-bottom:4px; scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  @media (prefers-reduced-motion:reduce){ .carousel-track{scroll-behavior:auto;} }
  .carousel-track::-webkit-scrollbar{height:6px;}
  #demo-track > *{scroll-snap-align:start; flex:0 0 min(380px,88%);}
  .car-nav{
    all:unset; cursor:pointer; position:absolute; top:calc(50% + 12px); transform:translateY(-50%);
    width:36px; height:36px; border-radius:50%; background:var(--surface-raised); border:1px solid var(--line);
    color:var(--text-primary); display:flex; align-items:center; justify-content:center; font-size:16px; z-index:3;
    transition:border-color .2s, opacity .2s;
  }
  .car-nav.prev{left:-14px;} .car-nav.next{right:-14px;}
  .car-nav:disabled{opacity:.3; cursor:default;}
  .car-nav:hover:not(:disabled){border-color:rgba(255,255,255,.3);}
  .car-nav:focus-visible{outline:2px solid var(--turquoise); outline-offset:2px;}
  @media (max-width:600px){.car-nav{display:none;}}
  .car-dots{display:flex; gap:6px; justify-content:center; margin-top:14px;}
  .car-dots button{all:unset; cursor:pointer; width:6px; height:6px; border-radius:50%; background:var(--line); transition:width .2s, background .2s;}
  .car-dots button.on{width:16px; border-radius:3px; background:var(--coral);}
  .car-dots button:focus-visible{outline:2px solid var(--turquoise); outline-offset:2px;}

  /* screens: real store-listing screenshots, no phone frame needed — the
     art already includes its own background/copy. */
  #screens-track > *{scroll-snap-align:start; flex:0 0 auto;}
  .screen-shot{height:480px; width:auto; border-radius:22px; display:block;
    box-shadow:0 24px 44px -16px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.04);}
  @media (max-width:600px){.screen-shot{height:400px;}}

  .demo-card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; display:flex; gap:16px; transition:border-color .2s, transform .2s, box-shadow .2s;}
  .demo-card:hover{border-color:rgba(255,255,255,.2); transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.25);}
  @media (max-width:520px){.demo-card{flex-direction:column;}}

  .demo-cover{position:relative; flex:none; width:112px; height:112px; border-radius:14px; overflow:hidden; background:var(--surface-raised);}
  @media (max-width:520px){.demo-cover{width:100%; height:180px;}}
  .demo-cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .demo-cover::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.45) 100%); pointer-events:none;}
  .demo-card.is-playing .demo-cover::before{content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 2px var(--turquoise); border-radius:14px; z-index:1; pointer-events:none;}

  .demo-play{all:unset; position:absolute; inset:0; margin:auto; width:44px; height:44px; border-radius:50%; background:var(--coral-strong); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35); transition:background .15s, transform .15s; z-index:2;}
  .demo-play svg{width:20px; height:20px;}
  .demo-play .ic-pause{display:none;}
  .demo-play.is-playing .ic-play{display:none;}
  .demo-play.is-playing .ic-pause{display:block;}
  .demo-play:hover{background:var(--coral-hover); transform:scale(1.06);}

  .demo-body{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:center;}
  .demo-body .kind{font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--moon-gold);}
  .demo-title{font-size:16px; font-weight:700; font-family:var(--font-body); margin-top:5px; line-height:1.3;}

  .demo-scrub{margin-top:12px;}
  .demo-track{position:relative; height:6px; border-radius:999px; background:rgba(255,255,255,.12); cursor:pointer;}
  .demo-fill{position:absolute; inset:0; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--turquoise),var(--lavender)); pointer-events:none;}
  .demo-thumb{position:absolute; top:50%; left:0%; width:12px; height:12px; border-radius:50%; background:#fff; transform:translate(-50%,-50%); opacity:0; transition:opacity .15s; box-shadow:0 1px 4px rgba(0,0,0,.4); pointer-events:none;}
  .demo-track:hover .demo-thumb, .demo-track:focus-visible .demo-thumb{opacity:1;}
  .demo-time{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums;}
  .demo-note{margin-top:18px; font-size:12.5px; color:var(--text-muted);}

  /* app-preview: lightweight phone mockups (scoped, no bleed into the rest of the page) */
  #app-preview{
    --cat-dormir:#8B80F5; --cat-relajar:#6FB8F0; --cat-valores:#4FD8B0; --cat-musica:#FF8FA3;
  }
  #app-preview .phone-row{display:flex; gap:32px; flex-wrap:wrap; margin-top:32px; justify-content:center;}
  #app-preview .phone-col{flex:0 0 auto; max-width:220px;}
  #app-preview .phone{width:220px; height:478px; border-radius:34px; border:8px solid #12102b; background:var(--bg-bottom); position:relative; overflow:hidden; box-shadow:0 24px 44px -16px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.04);}
  #app-preview .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:88px; height:16px; background:#12102b; border-radius:0 0 10px 10px; z-index:6;}
  #app-preview .home{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:74px; height:3px; border-radius:2px; background:rgba(255,255,255,.35); z-index:6;}
  #app-preview .screen{position:relative; height:100%; display:flex; flex-direction:column;}
  #app-preview .real-screen{width:100%; height:100%; object-fit:cover; object-position:top center; display:block;}
  #app-preview .statusbar{display:flex; justify-content:space-between; padding:8px 16px 2px; font-size:8.5px; color:var(--text-secondary); font-variant-numeric:tabular-nums;}

      pages: [

          en: 'Marcos wanted to take a nap with his pet iguana, Bolinha, but she had some very strange ways of resting: one minute she was hanging upside down from a branch, the next she was using an old flip-flop as a pillow.',

        { img: 'reading-demo/marcos-e-a-iguana-2.png', text: {
          es: '"¡Así no se puede, Bolinha!", se reía Marcos, intentando mostrarle la forma correcta: acostadita, quietecita, con los ojos cerrados. Pero cada vez que le mostraba, Bolinha inventaba una posición todavía más chistosa: apoyada de lado en una regadera, enroscada dentro de un balde.',
          en: '"That\'s not how it works, Bolinha!" Marcos laughed, trying to show her the right way: lying flat, nice and still, eyes closed. But every time he showed her, Bolinha came up with an even funnier position: propped sideways against a watering can, curled up inside a bucket.',
          pt: '"Assim não dá, Bolinha!", ria Marcos, e tentava mostrar o jeito certo: deitadinho, quietinho, olhos fechados. Mas a cada tentativa, Bolinha inventava uma posição nova e ainda mais engraçada: apoiada de lado num regador, enrolada dentro de um balde.'

        { img: 'reading-demo/marcos-e-a-iguana-3.png', text: {

          en: "After laughing so much at Bolinha's inventions, Marcos felt all worn out and lay down for real in the backyard hammock. And that's when, for the very first time, Bolinha settled down quietly right beside him, and the two of them drifted off together, calm and content, to the sound of the wind in the trees.",
          pt: 'Depois de tanto rir das invenções da Bolinha, Marcos ficou molinho de cansaço e se deitou de verdade na rede do quintal. Foi aí que, pela primeira vez, Bolinha se aconchegou bem quietinha ao lado dele, e os dois cochilaram juntos, tranquilos, ao som do vento nas árvores.'

    }
  ];

  var lang = (localStorage.getItem('coquisleep_lang')) || 'es';
  try { lang = localStorage.getItem('coquisleep_lang') || 'es'; } catch(e){ lang = 'es'; }

  function applyI18n(){
    var dict = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n');
      if (dict[k] !== undefined) el.textContent = dict[k];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){
      var k = el.getAttribute('data-i18n-html');
      if (dict[k] !== undefined) el.innerHTML = dict[k];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
      var k = el.getAttribute('data-i18n-placeholder');
      if (dict[k] !== undefined) el.setAttribute('placeholder', dict[k]);
    });
    document.querySelectorAll('.lang-chip button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-lang') === lang);
    });
    document.documentElement.setAttribute('lang', lang);
    renderCatalog();
    document.querySelectorAll('.demo-card').forEach(function(c){ if (c._syncLang) c._syncLang(); });
    renderReaderGrid();
    renderReader();
  }

  document.querySelectorAll('.lang-chip button').forEach(function(b){
    b.addEventListener('click', function(){
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('coquisleep_lang', lang); } catch(e){}
      applyI18n();
    });
  });

  var COUNT_WORD = { es: function(n){ return n === 1 ? 'historia' : 'historias'; }, en: function(n){ return n === 1 ? 'story' : 'stories'; }, pt: function(n){ return n === 1 ? 'história' : 'histórias'; } };
  function renderCatalog(){
    var data = CATALOG[lang];
    document.getElementById('cat-grid').innerHTML = data.map(function(cat){
      return (
        '<div class="cat-card show">' +
          '<svg class="cat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:26px;height:26px;color:var(--coral)">' + CAT_ICONS[cat.icon] + '</svg>' +
          '<div class="kind">' + cat.name + ' · ' + cat.count + ' ' + COUNT_WORD[lang](cat.count) + '</div>' +
          '<h3>' + cat.title + '</h3>' +
          '<p>' + cat.p + '</p>' +
        '</div>'
      );
    }).join('');
  }

  // "read demo" grid + paginated reader modal
  var readerState = { demo: null, idx: 0 };
  function renderReaderGrid(){
    var grid = document.getElementById('reader-grid');
    grid.innerHTML = '';
    READING_DEMOS.forEach(function(demo){
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'reader-card';
      var img = document.createElement('img');
      img.src = demo.cover; img.alt = ''; img.loading = 'lazy';
      var body = document.createElement('div');
      body.className = 'reader-card-body';
      var kind = document.createElement('div'); kind.className = 'kind'; kind.textContent = demo.kind[lang] || demo.kind.es;
      var title = document.createElement('div'); title.className = 'reader-card-title'; title.textContent = demo.title[lang] || demo.title.es;
      var cta = document.createElement('div'); cta.className = 'reader-card-cta'; cta.textContent = (I18N[lang] && I18N[lang].readBtn) || 'Leer';
      body.appendChild(kind); body.appendChild(title); body.appendChild(cta);
      card.appendChild(img); card.appendChild(body);
      card.addEventListener('click', function(){ openReader(demo); });
      grid.appendChild(card);
    });
  }

  function renderReader(){
    if (!readerState.demo) return;
    var page = readerState.demo.pages[readerState.idx];
    document.getElementById('reader-img').src = page.img;
    document.getElementById('reader-text').textContent = page.text[lang] || page.text.es;
    document.getElementById('reader-title').textContent = readerState.demo.title[lang] || readerState.demo.title.es;
    var dotsEl = document.getElementById('reader-dots');
    dotsEl.innerHTML = '';
    readerState.demo.pages.forEach(function(_, i){
      var d = document.createElement('span');
      d.className = 'reader-dot' + (i === readerState.idx ? ' on' : '');
      dotsEl.appendChild(d);
    });
    document.getElementById('reader-prev').disabled = readerState.idx === 0;
    document.getElementById('reader-next').disabled = readerState.idx === readerState.demo.pages.length - 1;

    var audioEl = document.getElementById('reader-audio');
    var audioBtn = document.getElementById('reader-audio-btn');
    audioEl.pause();
    audioBtn.classList.remove('is-playing');
    var src = page.audio && (page.audio[lang] || page.audio.es);
    if (src){
      audioBtn.hidden = false;
      audioEl.src = src;
    } else {
      audioBtn.hidden = true;
      audioEl.removeAttribute('src');
    }
  }
  function openReader(demo){
    readerState.demo = demo;
    readerState.idx = 0;
    renderReader();
    document.getElementById('reader-overlay').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeReader(){
    document.getElementById('reader-overlay').hidden = true;
    document.getElementById('reader-audio').pause();
    document.body.style.overflow = '';
  }
  document.getElementById('reader-prev').addEventListener('click', function(){ if (readerState.idx > 0){ readerState.idx--; renderReader(); } });
  document.getElementById('reader-next').addEventListener('click', function(){ if (readerState.demo && readerState.idx < readerState.demo.pages.length - 1){ readerState.idx++; renderReader(); } });
  document.getElementById('reader-close').addEventListener('click', closeReader);
  document.getElementById('reader-audio-btn').addEventListener('click', function(){
    var audioEl = document.getElementById('reader-audio');
    if (audioEl.paused) audioEl.play(); else audioEl.pause();
  });
  document.getElementById('reader-audio').addEventListener('play', function(){ document.getElementById('reader-audio-btn').classList.add('is-playing'); });
  document.getElementById('reader-audio').addEventListener('pause', function(){ document.getElementById('reader-audio-btn').classList.remove('is-playing'); });
  document.getElementById('reader-audio').addEventListener('ended', function(){ document.getElementById('reader-audio-btn').classList.remove('is-playing'); });
  document.getElementById('reader-overlay').addEventListener('click', function(e){ if (e.target.id === 'reader-overlay') closeReader(); });
  document.addEventListener('keydown', function(e){
    var overlay = document.getElementById('reader-overlay');
    if (overlay.hidden) return;
    if (e.key === 'Escape') closeReader();
    if (e.key === 'ArrowRight') document.getElementById('reader-next').click();
    if (e.key === 'ArrowLeft') document.getElementById('reader-prev').click();
  });

  // decorative waveform that visually eases down, echoing the "sound design" copy
  (function(){
    var row = document.getElementById('wave-row');
    var bars = 40;
    var html = '';
    for (var i = 0; i < bars; i++){
      var t = i / (bars - 1);
      var h = 14 + (1 - t) * 46 + Math.sin(i * 1.3) * 6 * (1 - t);
      html += '<span style="height:' + Math.max(6, h) + 'px"></span>';
    }
    row.innerHTML = html;
  })();

  // custom audio player for the free demo songs
  function formatTime(s){
    if (!isFinite(s)) return '--:--';
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function setupDemoPlayer(card){
    var audio = card.querySelector('.demo-audio');
    var btn = card.querySelector('.demo-play');
    var track = card.querySelector('.demo-track');
    var fill = card.querySelector('.demo-fill');
    var thumb = card.querySelector('.demo-thumb');
    var curEl = card.querySelector('.t-cur');
    var durEl = card.querySelector('.t-dur');

    function applySrcForLang(){
      var wasPlaying = !audio.paused;
      var pos = audio.currentTime || 0;
      var src = audio.getAttribute('data-src-' + lang);
      if (audio.currentSrc && audio.currentSrc.indexOf(src) !== -1) return;
      audio.src = src;
      audio.addEventListener('loadedmetadata', function onMeta(){
        audio.removeEventListener('loadedmetadata', onMeta);
        audio.currentTime = pos;
        durEl.textContent = formatTime(audio.duration);
        if (wasPlaying) audio.play();
      });
    }
    card._syncLang = applySrcForLang;
    applySrcForLang();

    function setPlaying(playing){
      btn.classList.toggle('is-playing', playing);
      card.classList.toggle('is-playing', playing);
    }

    btn.addEventListener('click', function(){
      document.querySelectorAll('.demo-audio').forEach(function(other){
        if (other !== audio && !other.paused) other.pause();
      });
      if (audio.paused) audio.play(); else audio.pause();
    });
    audio.addEventListener('play', function(){ setPlaying(true); });
    audio.addEventListener('pause', function(){ setPlaying(false); });
    audio.addEventListener('ended', function(){ setPlaying(false); });
    audio.addEventListener('timeupdate', function(){
      var pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      fill.style.width = pct + '%';
      thumb.style.left = pct + '%';
      curEl.textContent = formatTime(audio.currentTime);
      track.setAttribute('aria-valuenow', Math.round(pct));
    });
    audio.addEventListener('loadedmetadata', function(){
      durEl.textContent = formatTime(audio.duration);
    });

    function seek(clientX){
      var r = track.getBoundingClientRect();
      var pct = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
      if (audio.duration) audio.currentTime = pct * audio.duration;
    }
    track.addEventListener('pointerdown', function(e){
      seek(e.clientX);
      var move = function(ev){ seek(ev.clientX); };
      var up = function(){ document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    track.addEventListener('keydown', function(e){
      if (!audio.duration) return;
      if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
    });
  }
  document.querySelectorAll('.demo-card').forEach(setupDemoPlayer);

  function initCarousel(rootId){
    var root = document.getElementById(rootId);
    if (!root) return;
    var track = root.querySelector('.carousel-track');
    var prev = root.querySelector('.car-nav.prev');
    var next = root.querySelector('.car-nav.next');
    var dotsWrap = root.querySelector('.car-dots');
    var items = Array.prototype.slice.call(track.children);

    dotsWrap.innerHTML = '';
    items.forEach(function(_, i){
      var dot = document.createElement('button');
      dot.setAttribute('aria-label', 'Item ' + (i + 1));
      dot.addEventListener('click', function(){ items[i].scrollIntoView({ behavior:'smooth', inline:'start', block:'nearest' }); });
      dotsWrap.appendChild(dot);
    });
    var dots = Array.prototype.slice.call(dotsWrap.children);

    function closestIndex(){
      var pos = track.scrollLeft, best = 0, bestDist = Infinity;
      items.forEach(function(item, i){
        var d = Math.abs(item.offsetLeft - pos);
        if (d < bestDist){ bestDist = d; best = i; }
      });
      return best;
    }
    function update(){
      var i = closestIndex();
      dots.forEach(function(d, di){ d.classList.toggle('on', di === i); });
      prev.disabled = track.scrollLeft <= 4;
      next.disabled = track.scrollLeft >= track.scrollWidth - track.clientWidth - 4;
    }
    var raf;
    track.addEventListener('scroll', function(){
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(update);
    });
    prev.addEventListener('click', function(){
      items[Math.max(0, closestIndex() - 1)].scrollIntoView({ behavior:'smooth', inline:'start', block:'nearest' });
    });
    next.addEventListener('click', function(){
      items[Math.min(items.length - 1, closestIndex() + 1)].scrollIntoView({ behavior:'smooth', inline:'start', block:'nearest' });
    });
    update();
  }
  initCarousel('demo-carousel');
  initCarousel('screens-carousel');

  // sticky header gains a background once the page scrolls
  (function(){
    var header = document.getElementById('site-header');
    function onScroll(){ header.classList.toggle('scrolled', window.scrollY > 8); }
    document.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();

  // sections/cards fade+rise into view as the page scrolls
  (function(){
    var targets = document.querySelectorAll('section, .value-card, .cat-card, .sound-step, .demo-card');
    targets.forEach(function(el){ el.classList.add('reveal'); });
    if (!('IntersectionObserver' in window)){
      targets.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){ entry.target.classList.add('in'); io.unobserve(entry.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    targets.forEach(function(el){ io.observe(el); });
  })();

  applyI18n();

  // coqui greeting call: plays once per visit, on the first tap/click/key
  // (browsers block audio-with-sound before a user gesture, so this fires
  // on that first gesture rather than strictly on page load)
  (function(){
    var KEY = 'coquiSangThisVisit';
    if (sessionStorage.getItem(KEY)) return;
    var audio = new Audio('/coqui-call.mp3');
    audio.preload = 'auto';
    var fired = false;
    function sing(){
      if (fired) return;
      fired = true;
      sessionStorage.setItem(KEY, '1');
      document.body.classList.add('coqui-singing');
      audio.currentTime = 0;
      audio.play().catch(function(){});
      setTimeout(function(){ document.body.classList.remove('coqui-singing'); }, 1900);
      ['pointerdown', 'keydown', 'touchstart'].forEach(function(evt){
        document.removeEventListener(evt, sing);
      });
    }
    ['pointerdown', 'keydown', 'touchstart'].forEach(function(evt){
      document.addEventListener(evt, sing, { once: true, passive: true });
    });
  })();
})();
</script>
